<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../HTML/style.css">
    <title>My Profile Page</title>
</head>

<body>
    <center>
        <img id="profile-pic" src="../pictures/herm.pat.jpg">
            style="border-radius: 50%;" width="200px" alt="Profile Picture">
    </center>
    <h1 id="full-name">PATRICK JHOSH ALCORIZA</h1>

    <center>
        <h2>
            <a href="https://www.facebook.com/patrickjhosh.alcoriza" target="_blank" 
               style="text-decoration: none; color: rgb(0, 26, 255);">Visit my Facebook</a>
        </h2>
    </center>

    <div class="profile-container">
        <h1>Bio</h1>
        <p id="bio">Hello, I'm Patrick Jhosh Alcoriza, you can call me Pat for short.</p>
    </div>

    <div class="profile-container">
        <h1>My Favorites</h1>
        <ul id="favorites-list">
            <li>Cats</li>
            <li>The color black</li>
            <li>Video games</li>
        </ul>
    </div>

    <div class="profile-container">
        <h1>My Gallery</h1>
        <div class="gallery">
            <img src="C:/Users/Admin/Documents/ALCORIZA, PATRICK JHOSH/PICS/em.pat.jpg" width="200px" alt="Image 1">
        </div>
    </div>

    <div class="profile-container">
        <h1>My Favorite Song</h1>
        <audio controls loop>
            <source src="C:/Users/Admin/Documents/ALCORIZA, PATRICK JHOSH/AUDIO/wave to earth - seasons.mp3" 
                    type="audio/mp3">
        </audio>
    </div>

    <center>
        <h2>
            <a href="form.html" style="text-decoration: none; color: rgb(0, 26, 255);">Update Profile</a>
        </h2>
    </center>

    <script>
        // Retrieve user data from localStorage
        const userData = JSON.parse(localStorage.getItem('userData'));

        if (userData) {
            document.getElementById('full-name').textContent = 
                `${userData.firstName} ${userData.middleName} ${userData.lastName}`;
            document.getElementById('bio').textContent = userData.aboutMe;
            document.getElementById('favorites-list').innerHTML = userData.favorites.map(fav => `<li>${fav}</li>`).join('');
        }
    </script>
</body>
</html>
